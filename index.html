<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>火柴人奇遇</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background: #1a1a1a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      color: #fff;
      padding: 12px;
    }

    .game-container {
      width: 100%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    canvas {
      display: block;
      width: 100%;
      max-width: 600px;
      height: auto;
      aspect-ratio: 2 / 1;
      background: #222;
      border: 2px solid #444;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      touch-action: none;
      cursor: pointer;
    }

    .controls {
      margin-top: 16px;
      width: 100%;
      display: flex;
      justify-content: space-between;
      padding: 0 20px;
    }

    .ctrl-btn {
      background: #333;
      border: 2px solid #555;
      color: #fff;
      font-size: 2rem;
      width: 80px;
      height: 80px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.1s, transform 0.1s;
      touch-action: manipulation;
    }

    .ctrl-btn:active {
      background: #555;
      transform: scale(0.95);
    }

    .dialog-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.7);
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      padding: 20px;
      border-radius: 12px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      z-index: 10;
    }

    .dialog-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .dialog-box {
      width: 100%;
      background: #111;
      border: 2px solid #555;
      border-radius: 16px;
      padding: 20px;
      transform: translateY(20px);
      transition: transform 0.3s ease;
    }

    .dialog-overlay.active .dialog-box {
      transform: translateY(0);
    }

    .dialog-text {
      font-size: 1.1rem;
      line-height: 1.6;
      margin-bottom: 20px;
      color: #ddd;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .option-btn {
      background: #222;
      border: 1.5px solid #666;
      color: #fff;
      padding: 16px;
      border-radius: 10px;
      font-size: 1rem;
      text-align: left;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
      font-family: inherit;
      line-height: 1.4;
    }

    .option-btn:hover, .option-btn:active {
      background: #333;
      border-color: #999;
    }
  </style>
</head>
<body>

  <div class="game-container" id="gameContainer">
    <canvas id="gameCanvas" width="600" height="300"></canvas>
    
    <div class="controls">
      <div class="ctrl-btn" id="btnLeft">←</div>
      <div class="ctrl-btn" id="btnRight">→</div>
    </div>

    <div class="dialog-overlay" id="dialogOverlay">
      <div class="dialog-box">
        <div class="dialog-text" id="dialogText"></div>
        <div class="options" id="optionsContainer"></div>
      </div>
    </div>
  </div>

  <script>
    (function() {
      const canvas = document.getElementById('gameCanvas');
      const ctx = canvas.getContext('2d');
      const btnLeft = document.getElementById('btnLeft');
      const btnRight = document.getElementById('btnRight');
      const overlay = document.getElementById('dialogOverlay');
      const dialogText = document.getElementById('dialogText');
      const optionsContainer = document.getElementById('optionsContainer');

      // ---------- 音频合成 ----------
      let audioCtx = null;
      
      function initAudio() {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
      }

      // 合成脚步声 (调整了波形和音量，听起来更实)
      function playFootstep() {
        if (!audioCtx) return;
        const now = audioCtx.currentTime;
        
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        
        // 改用方波，模拟硬底鞋踩地的声音
        osc.type = 'square';
        osc.frequency.setValueAtTime(160, now);
        osc.frequency.exponentialRampToValueAtTime(60, now + 0.05);
        
        // 音量跟猫叫一样大 (之前是0.1，猫叫是0.15，现在调到0.2)
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
        
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        
        osc.start(now);
        osc.stop(now + 0.1);
      }

      // 合成猫叫声
      function playMeow() {
        if (!audioCtx) return;
        const now = audioCtx.currentTime;
        
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        const filter = audioCtx.createBiquadFilter();
        
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(600, now);
        osc.frequency.linearRampToValueAtTime(900, now + 0.1);
        osc.frequency.linearRampToValueAtTime(700, now + 0.3);
        osc.frequency.linearRampToValueAtTime(400, now + 0.5);
        
        gain.gain.setValueAtTime(0, now);
        gain.gain.linearRampToValueAtTime(0.2, now + 0.05); // 音量同步调大到0.2
        gain.gain.setValueAtTime(0.2, now + 0.2);
        gain.gain.linearRampToValueAtTime(0, now + 0.5);
        
        filter.type = 'lowpass';
        filter.frequency.value = 1500;
        
        osc.connect(filter);
        filter.connect(gain);
        gain.connect(audioCtx.destination);
        
        osc.start(now);
        osc.stop(now + 0.6);
      }

      // ---------- 游戏状态 ----------
      const GROUND_Y = 260;
      const PLAYER_SPEED = 2.5; 
      
      let player = { 
        x: 100, 
        y: GROUND_Y, 
        dir: 1, 
        state: 'idle',
        animTime: 0,
        stepTimer: 0 
      };
      
      let cat = { x: 450, y: GROUND_Y, active: true, met: false };
      let keys = { left: false, right: false };
      let gameState = 'playing'; 
      let questionMarkTime = 0;

      const storyData = {
        'meet_cat': {
          text: '走着走着，你遇到了一只黑猫。它静静地看着你，似乎有话要说。',
          options: [
            { text: '蹲下摸摸它', next: 'pet_cat' },
            { text: '无视它，继续往前走', next: 'ignore_cat' },
            { text: '对它做鬼脸', next: 'scare_cat' }
          ]
        },
        'pet_cat': {
          text: '黑猫舒服地蹭了蹭你的手，突然开口说话：“谢谢你，善良的人。我可以实现你一个愿望。”',
          options: [
            { text: '“我想要很多钱。”', next: 'wish_money' },
            { text: '“我想要超能力。”', next: 'wish_power' },
            { text: '“我希望世界和平。”', next: 'wish_peace' }
          ]
        },
        'wish_money': {
          text: '天上掉下了一大袋金币，刚好砸晕了你。醒来后你发现这是一个梦，但手里多了一根猫毛。',
          options: [{ text: '重新开始', next: 'restart' }]
        },
        'wish_power': {
          text: '黑猫赐予了你飞行的能力。你高兴地跳了起来，结果直接飞出了屏幕外。游戏结束。',
          options: [{ text: '重新开始', next: 'restart' }]
        },
        'wish_peace': {
          text: '黑猫深深看了你一眼：“你是个好人。” 它消失了。你感到内心无比平静。游戏通关！',
          options: [{ text: '重新开始', next: 'restart' }]
        },
        'ignore_cat': {
          text: '你头也不回地往前走。突然，背后传来一声猫叫，接着是一阵诡异的黑风。',
          options: [
            { text: '赶紧跑！', next: 'run_away' },
            { text: '回头看', next: 'look_back' }
          ]
        },
        'run_away': {
          text: '你拼命跑，但怎么也跑不出这条街。你永远被困在了这里。游戏结束。',
          options: [{ text: '重新开始', next: 'restart' }]
        },
        'look_back': {
          text: '回头一看，那只黑猫变成了巨大的怪物。你被一口吞掉了。游戏结束。',
          options: [{ text: '重新开始', next: 'restart' }]
        },
        'scare_cat': {
          text: '你对着猫做了一个极度扭曲的鬼脸。猫被吓得炸毛，跳起来给了你一爪子。',
          options: [
            { text: '跟它道歉', next: 'apologize' },
            { text: '跟它对骂', next: 'argue' }
          ]
        },
        'apologize': {
          text: '你赶紧道歉，并拿出随身携带的小鱼干。猫原谅了你，还告诉你前方有宝藏。',
          options: [{ text: '去寻宝', next: 'treasure' }]
        },
        'argue': {
          text: '你居然和猫吵了起来。路过的行人都在看你，最后你被当成精神病带走了。游戏结束。',
          options: [{ text: '重新开始', next: 'restart' }]
        },
        'treasure': {
          text: '你根据猫的指引，在垃圾桶旁边找到了一张皱巴巴的五十块钱。也算是一笔小财。',
          options: [{ text: '重新开始', next: 'restart' }]
        }
      };

      function init() {
        resetGame();
        requestAnimationFrame(gameLoop);
        
        // 解锁音频
        const activateAudio = () => {
          initAudio();
          document.removeEventListener('click', activateAudio);
          document.removeEventListener('touchstart', activateAudio);
        };
        document.addEventListener('click', activateAudio);
        document.addEventListener('touchstart', activateAudio);
      }

      function resetGame() {
        player.x = 100;
        player.dir = 1;
        player.state = 'idle';
        player.animTime = 0;
        player.stepTimer = 0;
        cat.x = 450;
        cat.active = true;
        cat.met = false;
        gameState = 'playing';
        overlay.classList.remove('active');
        questionMarkTime = 0;
      }

      function triggerStory(nodeId) {
        gameState = 'dialog';
        player.state = 'idle'; 
        
        const node = storyData[nodeId];
        if (!node) return;

        if (nodeId === 'meet_cat') playMeow();

        dialogText.textContent = node.text;
        optionsContainer.innerHTML = '';

        node.options.forEach(opt => {
          const btn = document.createElement('button');
          btn.className = 'option-btn';
          btn.textContent = opt.text;
          btn.onclick = () => {
            if (opt.next === 'restart' || !storyData[opt.next]) playMeow();
            if (opt.next === 'restart') resetGame();
            else triggerStory(opt.next);
          };
          optionsContainer.appendChild(btn);
        });

        overlay.classList.add('active');
      }

      function update(dt) {
        if (gameState === 'playing') {
          let moving = false;
          
          if (keys.left) {
            player.x -= PLAYER_SPEED;
            player.dir = -1;
            moving = true;
          }
          if (keys.right) {
            player.x += PLAYER_SPEED;
            player.dir = 1;
            moving = true;
          }

          player.x = Math.max(20, Math.min(canvas.width - 20, player.x));

          if (player.state !== 'confused') {
            if (moving) {
              player.state = 'walking';
              player.animTime += dt * 8;
              
              player.stepTimer += dt;
              if (player.stepTimer > 0.35) { // 脚步声节奏稍微放慢一点点，免得吵
                playFootstep();
                player.stepTimer = 0;
              }
            } else {
              player.state = 'idle';
              player.animTime = 0;
              player.stepTimer = 0;
            }
          }

          if (cat.active && !cat.met) {
            const dist = Math.abs(player.x - cat.x);
            if (dist < 45) {
              cat.met = true;
              player.state = 'confused';
              questionMarkTime = 1.5;
              triggerStory('meet_cat');
            }
          }
        }

        if (questionMarkTime > 0) {
          questionMarkTime -= dt;
        }
      }

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        const skyGrad = ctx.createLinearGradient(0, 0, 0, GROUND_Y);
        skyGrad.addColorStop(0, '#1a1a2e');
        skyGrad.addColorStop(1, '#16213e');
        ctx.fillStyle = skyGrad;
        ctx.fillRect(0, 0, canvas.width, GROUND_Y);

        ctx.fillStyle = '#fff';
        for (let i = 0; i < 30; i++) {
          const sx = (i * 73) % canvas.width;
          const sy = (i * 37) % 150;
          ctx.globalAlpha = 0.3 + (i % 5) * 0.1;
          ctx.fillRect(sx, sy, 2, 2);
        }
        ctx.globalAlpha = 1;

        ctx.fillStyle = '#0f0f1a';
        ctx.fillRect(0, GROUND_Y, canvas.width, canvas.height - GROUND_Y);

        ctx.strokeStyle = '#333';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(0, GROUND_Y);
        ctx.lineTo(canvas.width, GROUND_Y);
        ctx.stroke();

        if (cat.active && !cat.met) drawCat(cat.x, cat.y);
        drawStickman();
        if (questionMarkTime > 0) drawQuestionMark();
      }

      function drawStickman() {
        const x = player.x;
        const groundY = player.y;
        const dir = player.dir;
        
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 3;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        
        const headY = groundY - 50;
        const bodyTop = headY + 10;
        const bodyBottom = groundY - 20;

        let leftArmX, leftArmY, rightArmX, rightArmY;
        let leftKneeX, leftKneeY, leftFootX, leftFootY;
        let rightKneeX, rightKneeY, rightFootX, rightFootY;

        if (player.state === 'walking') {
          const swing = Math.sin(player.animTime) * 10;
          
          leftArmX = x - 12 * dir - swing * dir;
          leftArmY = bodyTop + 20;
          rightArmX = x + 12 * dir + swing * dir;
          rightArmY = bodyTop + 20;

          leftKneeX = x - 8 - swing * 0.5;
          leftKneeY = bodyBottom + 12;
          leftFootX = x - 10 - swing;
          leftFootY = groundY;

          rightKneeX = x + 8 + swing * 0.5;
          rightKneeY = bodyBottom + 12;
          rightFootX = x + 10 + swing;
          rightFootY = groundY;

        } else if (player.state === 'confused') {
          const scratch = Math.sin(Date.now() / 100) * 5;
          
          leftArmX = x - 10 * dir;
          leftArmY = bodyTop + 20;
          rightArmX = x + 10 * dir + scratch;
          rightArmY = headY + 5;

          leftKneeX = x - 6;
          leftKneeY = bodyBottom + 12;
          leftFootX = x - 10;
          leftFootY = groundY;

          rightKneeX = x + 6;
          rightKneeY = bodyBottom + 12;
          rightFootX = x + 10;
          rightFootY = groundY;

        } else {
          leftArmX = x - 15 * dir;
          leftArmY = bodyTop + 20;
          rightArmX = x + 15 * dir;
          rightArmY = bodyTop + 20;
          
          leftKneeX = x - 6;
          leftKneeY = bodyBottom + 12;
          leftFootX = x - 10;
          leftFootY = groundY;

          rightKneeX = x + 6;
          rightKneeY = bodyBottom + 12;
          rightFootX = x + 10;
          rightFootY = groundY;
        }

        ctx.beginPath();
        ctx.arc(x, headY, 8, 0, Math.PI * 2);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(x, bodyTop);
        ctx.lineTo(x, bodyBottom);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(x, bodyBottom);
        ctx.lineTo(leftKneeX, leftKneeY);
        ctx.lineTo(leftFootX, leftFootY);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(x, bodyBottom);
        ctx.lineTo(rightKneeX, rightKneeY);
        ctx.lineTo(rightFootX, rightFootY);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(x, bodyTop + 8);
        ctx.lineTo(leftArmX, leftArmY);
        ctx.stroke();
        
        ctx.beginPath();
        ctx.moveTo(x, bodyTop + 8);
        ctx.lineTo(rightArmX, rightArmY);
        ctx.stroke();

        if (player.state === 'confused') {
          ctx.beginPath();
          ctx.moveTo(x + 12, headY - 12);
          ctx.lineTo(x + 16, headY - 18);
          ctx.stroke();
        }
      }

      function drawQuestionMark() {
        const x = player.x + (player.dir === 1 ? 15 : -25);
        const y = player.y - 80 + Math.sin(Date.now() / 200) * 5;
        
        ctx.fillStyle = '#ffcc66';
        ctx.font = 'bold 28px system-ui, sans-serif';
        ctx.fillText('?', x, y);
      }

      function drawCat(x, groundY) {
        const catY = groundY - 25;
        
        ctx.fillStyle = '#000';
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2;
        
        ctx.beginPath();
        ctx.ellipse(x, catY + 10, 15, 12, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(x - 10, catY, 10, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(x - 18, catY - 6);
        ctx.lineTo(x - 22, catY - 16);
        ctx.lineTo(x - 12, catY - 8);
        ctx.fill();
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(x - 8, catY - 8);
        ctx.lineTo(x - 6, catY - 18);
        ctx.lineTo(x - 2, catY - 6);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = '#ffcc00';
        ctx.beginPath();
        ctx.arc(x - 13, catY - 2, 2, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(x - 7, catY - 2, 2, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = '#000';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(x + 14, catY + 10);
        ctx.quadraticCurveTo(x + 30, catY, x + 35, catY - 10);
        ctx.stroke();
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(x + 14, catY + 10);
        ctx.quadraticCurveTo(x + 30, catY, x + 35, catY - 10);
        ctx.stroke();

        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(x - 18, catY + 2);
        ctx.lineTo(x - 28, catY);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(x - 18, catY + 4);
        ctx.lineTo(x - 28, catY + 6);
        ctx.stroke();
      }

      let lastTime = performance.now();
      function gameLoop(time) {
        const dt = Math.min((time - lastTime) / 1000, 0.1);
        lastTime = time;
        
        update(dt);
        draw();
        requestAnimationFrame(gameLoop);
      }

      window.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowLeft' || e.key === 'a') { keys.left = true; e.preventDefault(); }
        if (e.key === 'ArrowRight' || e.key === 'd') { keys.right = true; e.preventDefault(); }
      });

      window.addEventListener('keyup', (e) => {
        if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = false;
        if (e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
      });

      function bindBtn(btn, key) {
        const start = (e) => { e.preventDefault(); keys[key] = true; };
        const end = (e) => { e.preventDefault(); keys[key] = false; };
        btn.addEventListener('touchstart', start, { passive: false });
        btn.addEventListener('touchend', end, { passive: false });
        btn.addEventListener('touchcancel', end, { passive: false });
        btn.addEventListener('mousedown', start);
        btn.addEventListener('mouseup', end);
        btn.addEventListener('mouseleave', end);
      }

      bindBtn(btnLeft, 'left');
      bindBtn(btnRight, 'right');

      init();

    })();
  </script>
</body>
</html>
